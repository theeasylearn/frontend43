<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">Interest Calculator</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="principal" class="form-label">Principal Amount ($)</label>
                                <input type="number" class="form-control" id="principal" placeholder="Enter principal amount" required>
                            </div>
                            <div class="mb-3">
                                <label for="rate" class="form-label">Annual Interest Rate (%)</label>
                                <input type="number" step="0.01" class="form-control" id="rate" placeholder="Enter interest rate" required>
                            </div>
                            <div class="mb-3">
                                <label for="time" class="form-label">Time Period (Years)</label>
                                <input type="number" class="form-control" id="time" placeholder="Enter time period" required>
                            </div>
                            <div class="mb-3">
                                <label for="interestType" class="form-label">Interest Type</label>
                                <select class="form-select" id="interestType">
                                    <option value="simple">Simple Interest</option>
                                    <option value="compound">Compound Interest</option>
                                </select>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Calculate</button>
                            </div>
                        </form>
                        <div class="mt-4">
                            <h5>Result:</h5>
                            <p class="border p-3 rounded bg-light">Interest: <span id="result">$0.00</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
